services:
  news:
    build: .
    ports:
      - "8080:8080"
    environment:
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      NEWS_UPLOAD_DIR: "/app/data/uploads"
    volumes:
      - ./data:/app/data
    restart: unless-stopped