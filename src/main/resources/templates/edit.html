<!DOCTYPE html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article Editor — भीमनगर टाइम्स</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="app-header"><div><div class="eyebrow">COPY DESK</div><h1>लेख संपादित करें</h1><p>प्रकाशन से पहले headline, body और side content को manually refine करें।</p></div></header><main class="workspace"><section class="card editor-card"><form th:action="@{/update}" th:object="\${article}" method="post"><div class="form-grid"><div><label>Section</label><input th:field="\${article.section}"></div><div><label>Headline</label><input th:field="\${article.headline}"></div><div><label>Dateline</label><input th:field="\${article.dateline}"></div></div><label>Subheadline</label><input th:field="\${article.subheadline}"><label>Strapline</label><input th:field="\${article.strapline}"><label>मुख्य समाचार</label><textarea th:field="\${article.body}" rows="15"></textarea><div class="form-grid"><div><label>Secondary heading</label><input th:field="\${article.secondaryHeading}"></div><div><label>Quote</label><input th:field="\${article.quote}"></div><div><label>Quote attribution</label><input th:field="\${article.quoteAttribution}"></div></div><label>Secondary body</label><textarea th:field="SECONDARY_\${article.body}" rows="5"></textarea><div class="form-grid"><div><label>Sidebar heading</label><input th:field="\${article.sidebarHeading}"></div><div><label>Sidebar body</label><input th:field="SIDEBAR_\${article.body}"></div></div><button class="primary-btn" type="submit">✓ Save & Preview</button> <a class="ghost-btn" href="/preview">Cancel</a></form></section></main></body></html>
